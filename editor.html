<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Editor - Provider Connections</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;padding:clamp(12px,3vw,20px)}.container{max-width:1400px;margin:0 auto}.header{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}button{background:#238636;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500}button:hover{background:#2ea043}button.secondary{background:#21262d}button.secondary:hover{background:#30363d}button.danger{background:#da3633}button.danger:hover{background:#f85149}input[type="file"]{display:none}.stats{background:#161b22;padding:15px;border-radius:6px;margin-bottom:20px;border:1px solid #30363d}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}.stat-item{display:flex;flex-direction:column;gap:5px}.stat-label{font-size:12px;color:#8b949e}.stat-value{font-size:20px;font-weight:600}.connections{display:flex;flex-direction:column;gap:20px}.provider-group{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:15px}.provider-group-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid #30363d}.provider-group-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}.provider-count{background:#21262d;color:#8b949e;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500}.provider-group-cards{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.connection-card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:15px;transition:border-color 0.2s}.connection-card:hover{border-color:#58a6ff}.connection-card.inactive{opacity:0.6}.card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px;gap:10px}.card-title{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.name{font-size:16px;font-weight:600}.provider-badge{display:inline-block;background:#1f6feb;color:white;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:500;text-transform:uppercase}.status-badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:500}.status-active{background:#238636;color:white}.status-inactive{background:#6e7681;color:white}.card-actions{display:flex;gap:5px}.card-actions button{padding:5px 10px;font-size:12px}.card-details{display:grid;gap:10px;font-size:13px}.detail-row{display:grid;grid-template-columns:150px 1fr;gap:10px}.detail-label{color:#8b949e}.detail-value{word-break:break-all}.token-field{font-family:'Courier New',monospace;font-size:11px;background:#0d1117;padding:5px 8px;border-radius:3px;border:1px solid #30363d}.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.filter-bar select,.filter-bar input{background:#0d1117;color:#c9d1d9;border:1px solid #30363d;padding:8px 12px;border-radius:6px;font-size:14px}.filter-bar input{flex:1;min-width:200px}#notification{position:fixed;top:20px;right:20px;background:#238636;color:white;padding:15px 20px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.5);display:none;z-index:1000}#notification.error{background:#da3633}.empty-state{text-align:center;padding:60px 20px;color:#8b949e}.empty-state svg{width:80px;height:80px;margin-bottom:20px;opacity:0.5}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:2000}.modal-content{background:#161b22;border:1px solid #30363d;border-radius:12px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid #30363d}.modal-header h2{font-size:18px;font-weight:600}.modal-close{background:transparent;border:none;color:#8b949e;font-size:24px;cursor:pointer;padding:0;width:32px;height:32px}.modal-close:hover{color:#f85149}.modal-body{padding:20px}.form-group{margin-bottom:20px}.form-group label{display:block;margin-bottom:10px;color:#8b949e;font-size:14px}.form-group input[type="file"]{display:block;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:10px;border-radius:6px;width:100%}.provider-checkbox{display:flex;align-items:center;gap:10px;padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;margin-bottom:8px;cursor:pointer}.provider-checkbox:hover{border-color:#58a6ff}.provider-checkbox input{width:18px;height:18px;cursor:pointer}.provider-checkbox-info{flex:1;display:flex;justify-content:space-between;align-items:center}.provider-checkbox-count{color:#8b949e;font-size:12px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}#mergePreview{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:15px;max-height:200px;overflow-y:auto}.preview-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d;font-size:13px}.preview-item:last-child{border-bottom:none}.preview-item .dup{color:#f85149}.preview-item .new{color:#3fb950}@media(max-width:768px){body{padding:12px}.header{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}.header::-webkit-scrollbar{display:none}.header button{flex:0 0 auto;white-space:nowrap;padding:8px 14px;font-size:13px}.stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}.filter-bar{flex-direction:column}.filter-bar input,.filter-bar select{width:100%;min-width:0}.card-header{flex-direction:column;align-items:stretch}.card-actions{justify-content:flex-end}.detail-row{grid-template-columns:1fr;gap:2px}.modal-content{width:100%;max-height:100vh;height:100%;border-radius:0}#notification{left:12px;right:12px;top:12px}}@media(max-width:420px){.stats-grid{grid-template-columns:1fr 1fr}.provider-group{padding:12px}.connection-card{padding:12px}}</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button onclick="document.getElementById('fileInput').click()">
                Load JSON
            </button>
            <input type="file" id="fileInput" accept=".json" onchange="loadFile(event)">
            <button onclick="saveFile()" class="secondary">Save JSON</button>
            <button onclick="exportBackup()" class="secondary">Export Backup</button>
            <button onclick="toggleAll()" class="secondary">Toggle All Active</button>
            <button onclick="openMergeModal()" class="secondary">Merge Provider</button>
        </div>

        <div id="mergeModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Merge Provider from Another JSON</h2>
                    <button onclick="closeMergeModal()" class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Select JSON File to Merge</label>
                        <input type="file" id="mergeFileInput" accept=".json" onchange="loadMergeFile(event)">
                    </div>
                    
                    <div class="form-group" id="mergeProvidersContainer" style="display: none;">
                        <label>Select Providers to Merge</label>
                        <div id="mergeProvidersList"></div>
                    </div>

                    <div class="form-group" id="mergePreviewContainer" style="display: none;">
                        <label>Merge Preview</label>
                        <div id="mergePreview"></div>
                    </div>

                    <div class="modal-actions">
                        <button onclick="executeMerge()" class="secondary" id="mergeExecuteBtn" style="display: none;">Merge Now</button>
                        <button onclick="closeMergeModal()" class="secondary">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search name or email..." oninput="applyFilters()">
            <select id="providerFilter" onchange="applyFilters()">
                <option value="">All Providers</option>
            </select>
            <select id="statusFilter" onchange="applyFilters()">
                <option value="">All Statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <div class="connections" id="connections"></div>
        
        <div class="empty-state" id="emptyState" style="display: none;">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
            </svg>
            <h3>No data</h3>
            <p>Load a JSON file to start editing</p>
        </div>
    </div>

    <div id="notification"></div>

    <script>let data=null;let filtered=[];function notify(message,isError=false){const notif=document.getElementById('notification');notif.textContent=message;notif.className=isError?'error':'';notif.style.display='block';setTimeout(()=>notif.style.display='none',3000);}function loadFile(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(e)=>{try{data=JSON.parse(e.target.result);if(!data.providerConnections){throw new Error('Format JSON tidak valid');}filtered=[...data.providerConnections];render();notify('JSON loaded successfully');}catch(err){notify('Error: '+err.message,true);}};reader.readAsText(file);}function saveFile(){if(!data){notify('No data to save',true);return;}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='edited_'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.json';a.click();URL.revokeObjectURL(url);notify('JSON saved successfully');}function exportBackup(){if(!data)return;const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='backup_'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.json';a.click();URL.revokeObjectURL(url);notify('Backup exported successfully');}function toggleConnection(id){const conn=data.providerConnections.find(c=>c.id===id);if(conn){conn.isActive=!conn.isActive;render();notify(`${conn.name} ${conn.isActive ? 'enabled' : 'disabled'}`);}}function deleteConnection(id){if(!confirm('Delete this connection?'))return;data.providerConnections=data.providerConnections.filter(c=>c.id!==id);filtered=filtered.filter(c=>c.id!==id);render();notify('Connection deleted');}function toggleAll(){if(!data)return;const allActive=data.providerConnections.every(c=>c.isActive);data.providerConnections.forEach(c=>c.isActive=!allActive);filtered=[...data.providerConnections];render();notify(allActive?'All connections disabled':'All connections enabled');}function applyFilters(){if(!data)return;const search=document.getElementById('searchInput').value.toLowerCase();const provider=document.getElementById('providerFilter').value;const status=document.getElementById('statusFilter').value;filtered=data.providerConnections.filter(conn=>{const matchSearch=!search||(conn.name||'').toLowerCase().includes(search)||(conn.email||'').toLowerCase().includes(search);const matchProvider=!provider||conn.provider===provider;const matchStatus=!status||(status==='active'&&conn.isActive)||(status==='inactive'&&!conn.isActive);return matchSearch&&matchProvider&&matchStatus;});renderConnections();}function render(){if(!data){document.getElementById('emptyState').style.display='block';document.getElementById('stats').style.display='none';document.getElementById('connections').style.display='none';return;}document.getElementById('emptyState').style.display='none';document.getElementById('stats').style.display='block';document.getElementById('connections').style.display='grid';renderStats();renderFilters();renderConnections();}function renderStats(){const conns=data.providerConnections;const active=conns.filter(c=>c.isActive).length;const providers=[...new Set(conns.map(c=>c.provider))];document.getElementById('stats').innerHTML=`
<div class="stats-grid">
<div class="stat-item">
<div class="stat-label">Total Connections</div>
<div class="stat-value">${conns.length}</div>
</div>
<div class="stat-item">
<div class="stat-label">Active</div>
<div class="stat-value" style="color: #3fb950">${active}</div>
</div>
<div class="stat-item">
<div class="stat-label">Inactive</div>
<div class="stat-value" style="color: #f85149">${conns.length - active}</div>
</div>
<div class="stat-item">
<div class="stat-label">Provider</div>
<div class="stat-value">${providers.length}</div>
</div>
</div>
`;}function renderFilters(){const providers=[...new Set(data.providerConnections.map(c=>c.provider))].sort();const select=document.getElementById('providerFilter');const current=select.value;select.innerHTML='<option value="">All Providers</option>'+providers.map(p=>`<option value="${p}" ${p === current ? 'selected' : ''}>${p}</option>`).join('');}function renderConnections(){const container=document.getElementById('connections');if(filtered.length===0){container.innerHTML='<div class="empty-state"><h3>No results</h3><p>Try adjusting your search filters</p></div>';return;}const grouped={};filtered.forEach(conn=>{if(!grouped[conn.provider]){grouped[conn.provider]=[];}grouped[conn.provider].push(conn);});const providers=Object.keys(grouped).sort();container.innerHTML=providers.map(provider=>{const conns=grouped[provider];const activeCount=conns.filter(c=>c.isActive).length;return`
<div class="provider-group">
<div class="provider-group-header">
<div class="provider-group-title">
<span class="provider-badge">${provider}</span>
<span class="provider-count">${activeCount}/${conns.length} active</span>
</div>
</div>
<div class="provider-group-cards">
${conns.map(conn => renderConnectionCard(conn)).join('')}
</div>
</div>
`;}).join('');}function renderConnectionCard(conn){const lastUsed=conn.lastUsedAt?new Date(conn.lastUsedAt).toLocaleString('id-ID'):'-';const created=conn.createdAt?new Date(conn.createdAt).toLocaleString('id-ID'):'-';return`
<div class="connection-card ${conn.isActive ? '' : 'inactive'}">
<div class="card-header">
<div class="card-title">
<div class="name">${conn.name || 'Unnamed'}</div>
<div>
<span class="status-badge ${conn.isActive ? 'status-active' : 'status-inactive'}">
${conn.isActive ? 'Active' : 'Inactive'}
</span>
</div>
</div>
<div class="card-actions">
<button onclick="toggleConnection('${conn.id}')" class="secondary">
${conn.isActive ? 'Pause' : 'Resume'}
</button>
<button onclick="deleteConnection('${conn.id}')" class="danger">Delete</button>
</div>
</div>
<div class="card-details">
${conn.email ? `
<div class="detail-row">
<div class="detail-label">Email</div>
<div class="detail-value">${conn.email}</div>
</div>` : ''}
<div class="detail-row">
<div class="detail-label">ID</div>
<div class="detail-value token-field">${conn.id}</div>
</div>
${conn.apiKey ? `
<div class="detail-row">
<div class="detail-label">API Key</div>
<div class="detail-value token-field">${conn.apiKey}</div>
</div>` : ''}
${conn.accessToken ? `
<div class="detail-row">
<div class="detail-label">Access Token</div>
<div class="detail-value token-field">${conn.accessToken.slice(0, 50)}...</div>
</div>` : ''}
<div class="detail-row">
<div class="detail-label">Priority</div>
<div class="detail-value">${conn.priority || 0}</div>
</div>
<div class="detail-row">
<div class="detail-label">Test Status</div>
<div class="detail-value">${conn.testStatus || '-'}</div>
</div>
<div class="detail-row">
<div class="detail-label">Last Used</div>
<div class="detail-value">${lastUsed}</div>
</div>
<div class="detail-row">
<div class="detail-label">Created</div>
<div class="detail-value">${created}</div>
</div>
</div>
</div>
`;}render();let mergeData=null;let selectedProviders=[];let mergeGrouped={};function openMergeModal(){if(!data){notify('Load the main JSON file first',true);return;}document.getElementById('mergeModal').style.display='flex';mergeData=null;selectedProviders=[];mergeGrouped={};document.getElementById('mergeProvidersContainer').style.display='none';document.getElementById('mergePreviewContainer').style.display='none';document.getElementById('mergeExecuteBtn').style.display='none';document.getElementById('mergeFileInput').value='';}function closeMergeModal(){document.getElementById('mergeModal').style.display='none';mergeData=null;selectedProviders=[];mergeGrouped={};}function loadMergeFile(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(e)=>{try{mergeData=JSON.parse(e.target.result);if(!mergeData.providerConnections){throw new Error('Format JSON tidak valid');}renderMergeProviders();}catch(err){notify('Error: '+err.message,true);mergeData=null;}};reader.readAsText(file);}function renderMergeProviders(){if(!mergeData)return;mergeGrouped={};mergeData.providerConnections.forEach(conn=>{if(!mergeGrouped[conn.provider]){mergeGrouped[conn.provider]=[];}mergeGrouped[conn.provider].push(conn);});const providers=Object.keys(mergeGrouped).sort();const existingIds=new Set(data.providerConnections.map(c=>c.id));const container=document.getElementById('mergeProvidersList');container.innerHTML=providers.map(provider=>{const conns=mergeGrouped[provider];const newCount=conns.filter(c=>!existingIds.has(c.id)).length;return`
<label class="provider-checkbox">
<input type="checkbox" value="${provider}" onchange="toggleMergeProvider('${provider}', this.checked)">
<div class="provider-checkbox-info">
<span class="provider-badge">${provider}</span>
<span class="provider-checkbox-count">
${conns.length} connection(s) (${newCount} new)
</span>
</div>
</label>
`;}).join('');document.getElementById('mergeProvidersContainer').style.display='block';}function toggleMergeProvider(provider,checked){if(checked){if(!selectedProviders.includes(provider)){selectedProviders.push(provider);}}else{selectedProviders=selectedProviders.filter(p=>p!==provider);}updateMergePreview();}function updateMergePreview(){if(selectedProviders.length===0){document.getElementById('mergePreviewContainer').style.display='none';document.getElementById('mergeExecuteBtn').style.display='none';return;}const existingIds=new Set(data.providerConnections.map(c=>c.id));const toMerge=[];const duplicates=[];selectedProviders.forEach(provider=>{(mergeGrouped[provider]||[]).forEach(conn=>{if(existingIds.has(conn.id)){duplicates.push(conn);}else{toMerge.push(conn);}});});const preview=document.getElementById('mergePreview');preview.innerHTML=`
${duplicates.length > 0 ? `
<div style="margin-bottom: 15px;">
<strong style="color: #f85149;">${duplicates.length} duplicate(s) (will be skipped):</strong>
${duplicates.map(c => `
<div class="preview-item">
<span>${c.name || 'Unnamed'}</span>
<span class="dup">duplicate ID</span>
</div>
`).join('')}
</div>
` : ''}
${toMerge.length > 0 ? `
<div>
<strong style="color: #3fb950;">${toMerge.length} to be merged:</strong>
${toMerge.slice(0, 20).map(c => `
<div class="preview-item">
<span>${c.name || 'Unnamed'}</span>
<span class="new">${c.provider}</span>
</div>
`).join('')}
${toMerge.length > 20 ? `<div class="preview-item"><span>...and ${toMerge.length - 20} more</span></div>` : ''}
</div>
` : '<div style="color: #8b949e;">No new data to merge</div>'}
`;document.getElementById('mergePreviewContainer').style.display='block';document.getElementById('mergeExecuteBtn').style.display=toMerge.length>0?'inline-block':'none';}function executeMerge(){if(!mergeData||selectedProviders.length===0)return;const existingIds=new Set(data.providerConnections.map(c=>c.id));const basePriority=Math.max(...data.providerConnections.map(c=>c.priority||0),0);const nameCounters={};data.providerConnections.forEach(c=>{if(!nameCounters[c.provider]){nameCounters[c.provider]={};}const match=c.name.match(/^(.+?)\s+(\d+)$/);if(match){const base=match[1];const num=parseInt(match[2]);if(!nameCounters[c.provider][base]||nameCounters[c.provider][base]<num){nameCounters[c.provider][base]=num;}}});const toMerge=[];selectedProviders.forEach(provider=>{(mergeGrouped[provider]||[]).filter(c=>!existingIds.has(c.id)).forEach(conn=>toMerge.push(conn));});const assignedNames={};data.providerConnections.forEach(c=>{if(!assignedNames[c.provider]){assignedNames[c.provider]=new Set();}assignedNames[c.provider].add(c.name);});let added=0;toMerge.forEach(conn=>{conn.priority=basePriority+added+1;conn.isActive=conn.isActive!==false;if(assignedNames[conn.provider]?.has(conn.name)){const match=conn.name.match(/^(.+?)\s+(\d+)$/);const base=match?match[1]:conn.name;if(!nameCounters[conn.provider]){nameCounters[conn.provider]={};}if(!nameCounters[conn.provider][base]){nameCounters[conn.provider][base]=match?parseInt(match[2]):0;}let candidate;do{nameCounters[conn.provider][base]++;candidate=`${base} ${nameCounters[conn.provider][base]}`;}while(assignedNames[conn.provider]?.has(candidate));conn.name=candidate;}if(!assignedNames[conn.provider]){assignedNames[conn.provider]=new Set();}assignedNames[conn.provider].add(conn.name);data.providerConnections.push(conn);added++;});filtered=[...data.providerConnections];render();closeMergeModal();notify(`${added} connection(s) merged successfully`);}</script>
</body>
</html>
